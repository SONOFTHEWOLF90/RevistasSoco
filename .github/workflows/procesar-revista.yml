name: Procesar revista

on:
  workflow_dispatch:
    inputs:
      pdf_r2_path:
        description: "Ruta del PDF en R2"
        required: true
        type: string

      pdf_filename:
        description: "Nombre original del PDF"
        required: true
        type: string

      editorial:
        description: "Editorial"
        required: true
        type: string

      collection:
        description: "Colección"
        required: true
        type: string

      issue:
        description: "Número"
        required: true
        type: string

      name:
        description: "Nombre de la revista"
        required: true
        type: string

      import_id:
        description: "Identificador único de la importación"
        required: true
        type: string

jobs:
  procesar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone poppler-utils webp

      - name: Configurar R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone

          cat > ~/.config/rclone/rclone.conf <<EOF_RCLONE
          [alpaca-r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          no_check_bucket = true
          EOF_RCLONE

          rclone version

      - name: Marcar importación como procesando
        env:
          IMPORT_ID: ${{ inputs.import_id }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p /tmp/import-status

          cat > /tmp/import-status/status.json <<EOF
          {
            "status": "processing",
            "importId": "${IMPORT_ID}"
          }
          EOF

          rclone copyto \
            /tmp/import-status/status.json \
            "alpaca-r2:${R2_BUCKET}/imports/status/${IMPORT_ID}.json"

      - name: Crear carpetas
        run: |
          mkdir -p work/pdf
          mkdir -p work/jpeg
          mkdir -p work/webp/thumbs

      - name: Calcular metadatos y destino R2
        id: metadata
        env:
          EDITORIAL: ${{ inputs.editorial }}
          COLLECTION: ${{ inputs.collection }}
          ISSUE: ${{ inputs.issue }}
          NAME: ${{ inputs.name }}
          PDF_R2_PATH: ${{ inputs.pdf_r2_path }}
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import re
          import unicodedata
          from pathlib import Path

          editorial = "${{ inputs.editorial }}"
          collection = "${{ inputs.collection }}"
          issue = "${{ inputs.issue }}"
          name = "${{ inputs.name }}"
          filename = Path("${{ inputs.pdf_r2_path }}").name

          def slugify(value):
              value = str(value or "").strip().lower()
              value = value.replace("ß", "ss")
              value = value.replace("ä", "ae")
              value = value.replace("ö", "oe")
              value = value.replace("ü", "ue")

              value = unicodedata.normalize("NFKD", value)
              value = "".join(
                  char for char in value
                  if not unicodedata.combining(char)
              )

              value = re.sub(r"[^\w\s-]", "", value, flags=re.UNICODE)
              value = re.sub(r"[-\s]+", "-", value).strip("-")

              return value or "sin-dato"

          def clean_prefix_from_filename(filename):
              stem = Path(filename).stem
              stem = re.sub(r"(?i)-00$", "", stem)
              stem = re.sub(r"(?i)_00$", "", stem)
              return stem

          def create_magazine_prefix(editorial, collection, issue, filename):
              editorial_norm = slugify(editorial)
              collection_norm = slugify(collection)

              if editorial_norm == "lang-yarns" and collection_norm == "fam":
                  return f"FAM-{issue}"

              if editorial_norm == "lana-grossa" and collection_norm == "all-seasons":
                  return f"AS.{str(issue).zfill(2)}"

              return clean_prefix_from_filename(filename)

          def normalize_path(value):
              return str(value).replace("\\", "/").lstrip("/")

          catalog_path = Path("catalogo.json")

          if not catalog_path.exists():
              raise RuntimeError("No existe catalogo.json")

          with open(catalog_path, "r", encoding="utf-8") as f:
              catalog = json.load(f)

          editorial_slug = slugify(editorial)
          collection_slug = slugify(collection)

          base = slugify(issue) if str(issue).strip() else slugify(name)

          candidate = f"magazines/{editorial_slug}/{collection_slug}/{base}"

          used = {
              normalize_path(item.get("r2_path", ""))
              for item in catalog
              if item.get("r2_path")
          }

          if candidate not in used:
              r2_path = candidate
          else:
              name_slug = slugify(name)

              candidate = (
                  f"magazines/{editorial_slug}/{collection_slug}/"
                  f"{base}-{name_slug}"
              )

              if name_slug and candidate not in used:
                  r2_path = candidate
              else:
                  digest = hashlib.sha1(
                      filename.encode("utf-8")
                  ).hexdigest()[:8]

                  r2_path = (
                      f"magazines/{editorial_slug}/{collection_slug}/"
                      f"{base}-{digest}"
                  )

          prefix = create_magazine_prefix(
              editorial,
              collection,
              issue,
              filename,
          )

          with open("/tmp/metadata.json", "w", encoding="utf-8") as f:
              json.dump(
                  {
                      "editorial": editorial,
                      "collection": collection,
                      "issue": issue,
                      "name": name,
                      "filename": filename,
                      "prefix": prefix,
                      "r2_path": r2_path,
                  },
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          print("========================================")
          print("METADATOS")
          print("========================================")
          print(f"Editorial: {editorial}")
          print(f"Colección: {collection}")
          print(f"Número:    {issue}")
          print(f"Nombre:    {name}")
          print(f"Archivo:   {filename}")
          print(f"Prefijo:   {prefix}")
          print(f"R2:        {r2_path}")
          print("========================================")
          PY

          echo "magazine_prefix=$(python3 -c 'import json; print(json.load(open("/tmp/metadata.json"))["prefix"])')" >> "$GITHUB_OUTPUT"
          echo "r2_path=$(python3 -c 'import json; print(json.load(open("/tmp/metadata.json"))["r2_path"])')" >> "$GITHUB_OUTPUT"

      - name: Descargar PDF desde R2
        env:
          PDF_R2_PATH: ${{ inputs.pdf_r2_path }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copy \
            "alpaca-r2:${R2_BUCKET}/${PDF_R2_PATH}" \
            work/pdf/

          echo "PDF descargado:"
          ls -lh work/pdf/

      - name: PDF → JPEG
        run: |
          pdftoppm \
            -cropbox \
            -r 120 \
            -jpeg \
            -jpegopt quality=95 \
            work/pdf/*.pdf \
            work/jpeg/page

          pages=$(find work/jpeg -name 'page-*.jpg' | wc -l)

          if [ "$pages" -eq 0 ]; then
            echo "ERROR: No se generaron páginas JPEG."
            exit 1
          fi

          echo "Páginas JPEG: $pages"
          echo "pages=$pages" >> "$GITHUB_OUTPUT"

      - name: JPEG → WebP
        env:
          MAGAZINE_PREFIX: ${{ steps.metadata.outputs.magazine_prefix }}
        run: |
          total=$(find work/jpeg -name 'page-*.jpg' | wc -l)
          index=0

          for jpeg in work/jpeg/page-*.jpg; do
            index=$((index + 1))

            output=$(printf "work/webp/${MAGAZINE_PREFIX}-%03d.webp" "$index")

            cwebp \
              -q 85 \
              -resize 1800 0 \
              "$jpeg" \
              -o "$output"

            echo "WebP $index/$total: $(basename "$output")"
          done

      - name: Crear thumbnails
        env:
          MAGAZINE_PREFIX: ${{ steps.metadata.outputs.magazine_prefix }}
        run: |
          total=$(find work/webp -maxdepth 1 \
            -name "${MAGAZINE_PREFIX}-*.webp" | wc -l)

          index=0

          for webp in $(find work/webp -maxdepth 1 \
            -name "${MAGAZINE_PREFIX}-*.webp" | sort); do

            index=$((index + 1))

            output=$(printf "work/webp/thumbs/%03d.webp" "$index")

            cwebp \
              -q 75 \
              -resize 320 0 \
              "$webp" \
              -o "$output"

            echo "Thumbnail $index/$total: $(basename "$output")"
          done

      - name: Crear portada
        env:
          MAGAZINE_PREFIX: ${{ steps.metadata.outputs.magazine_prefix }}
        run: |
          first_page=$(find work/webp -maxdepth 1 \
            -name "${MAGAZINE_PREFIX}-*.webp" \
            | sort \
            | head -n 1)

          if [ -z "$first_page" ]; then
            echo "ERROR: No existe ninguna página WebP."
            exit 1
          fi

          cp "$first_page" work/webp/cover.webp

          echo "Portada creada:"
          ls -lh work/webp/cover.webp

      - name: Resumen
        id: resumen
        env:
          R2_PATH: ${{ steps.metadata.outputs.r2_path }}
          MAGAZINE_PREFIX: ${{ steps.metadata.outputs.magazine_prefix }}
        run: |
          pages=$(find work/webp -maxdepth 1 \
            -name "${MAGAZINE_PREFIX}-*.webp" \
            | wc -l)

          thumbs=$(find work/webp/thumbs \
            -type f \
            -name '*.webp' \
            | wc -l)

          expected=$((pages * 2 + 1))

          echo "========================================"
          echo "RESUMEN"
          echo "========================================"
          echo "Editorial:  ${{ inputs.editorial }}"
          echo "Colección:  ${{ inputs.collection }}"
          echo "Número:     ${{ inputs.issue }}"
          echo "Nombre:     ${{ inputs.name }}"
          echo "Páginas:    $pages"
          echo "Thumbnails: $thumbs"
          echo "Portada:    1"
          echo "Esperados:  $expected"
          echo "R2:         $R2_PATH"
          echo "========================================"

          echo "pages=$pages" >> "$GITHUB_OUTPUT"
          echo "thumbs=$thumbs" >> "$GITHUB_OUTPUT"
          echo "expected=$expected" >> "$GITHUB_OUTPUT"

      - name: Subir revista a R2
        env:
          R2_PATH: ${{ steps.metadata.outputs.r2_path }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copy \
            work/webp/ \
            "alpaca-r2:${R2_BUCKET}/${R2_PATH}/"

          echo "Subida completada."

      - name: Verificar R2
        env:
          R2_PATH: ${{ steps.metadata.outputs.r2_path }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          EXPECTED: ${{ steps.resumen.outputs.expected }}
        run: |
          echo "========================================"
          echo "VERIFICACIÓN R2"
          echo "========================================"

          count=$(rclone lsf \
            "alpaca-r2:${R2_BUCKET}/${R2_PATH}/" \
            --files-only \
            --recursive \
            | wc -l)

          echo "Archivos encontrados: $count"
          echo "Archivos esperados:   $EXPECTED"

          if [ "$count" -ne "$EXPECTED" ]; then
            echo "ERROR: La cantidad de archivos no coincide."
            exit 1
          fi

          echo "Verificación R2 correcta."

      - name: Actualizar catalogo.json
        env:
          EDITORIAL: ${{ inputs.editorial }}
          COLLECTION: ${{ inputs.collection }}
          ISSUE: ${{ inputs.issue }}
          NAME: ${{ inputs.name }}
          PDF_R2_PATH: ${{ inputs.pdf_r2_path }}
          MAGAZINE_PREFIX: ${{ steps.metadata.outputs.magazine_prefix }}
          R2_PATH: ${{ steps.metadata.outputs.r2_path }}
          PAGES: ${{ steps.resumen.outputs.pages }}
        run: |
          python3 <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          editorial = "${{ inputs.editorial }}"
          collection = "${{ inputs.collection }}"
          issue = "${{ inputs.issue }}"
          name = "${{ inputs.name }}"
          filename = "${{ inputs.pdf_filename }}"
          pages = int("${{ steps.resumen.outputs.pages }}")
          prefix = "${{ steps.metadata.outputs.magazine_prefix }}"
          r2_path = "${{ steps.metadata.outputs.r2_path }}"

          catalog_path = Path("catalogo.json")

          with open(catalog_path, "r", encoding="utf-8") as f:
              catalog = json.load(f)

          def matches(magazine):
              return (
                  str(magazine.get("editorial", "")).strip().casefold()
                  == editorial.strip().casefold()
                  and str(magazine.get("coleccion", "")).strip().casefold()
                  == collection.strip().casefold()
                  and str(magazine.get("numero", "")).strip().casefold()
                  == issue.strip().casefold()
                  and str(magazine.get("nombre", "")).strip().casefold()
                  == name.strip().casefold()
              )

          existing = next(
              (magazine for magazine in catalog if matches(magazine)),
              None,
          )

          now = datetime.now(timezone.utc).astimezone().isoformat(
              timespec="seconds"
          )

          if existing:
              existing_r2 = existing.get("r2_path")

              if existing_r2 and existing_r2 != r2_path:
                  raise RuntimeError(
                      "Ya existe una revista con estos datos y tiene otra "
                      f"ruta R2: {existing_r2}"
                  )

              existing["paginas"] = pages
              existing["r2_path"] = r2_path
              existing["prefix"] = prefix
              existing["cover"] = "cover.webp"
              existing["fecha_importacion"] = now

              if not existing.get("ruta"):
                  existing["ruta"] = f"Remoto/{editorial}/{collection}/{filename}"

              if not existing.get("archivo"):
                  existing["archivo"] = filename

              existing["estado"] = "OK"

              result = "registro existente"

          else:
              magazine = {
                  "estado": "OK",
                  "editorial": editorial,
                  "coleccion": collection,
                  "numero": issue,
                  "nombre": name,
                  "archivo": filename,
                  "ruta": f"Remoto/{editorial}/{collection}/{filename}",
                  "paginas": pages,
                  "r2_path": r2_path,
                  "prefix": prefix,
                  "cover": "cover.webp",
                  "fecha_importacion": now,
                  "origen": "remoto",
              }

              catalog.append(magazine)
              result = "nueva revista"

          temp_path = catalog_path.with_suffix(".json.tmp")

          with open(temp_path, "w", encoding="utf-8") as f:
              json.dump(
                  catalog,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )
              f.write("\n")

          temp_path.replace(catalog_path)

          print(f"CATÁLOGO ACTUALIZADO: {result}")
          PY

          echo "catalogo.json actualizado."

      - name: Revisar cambios del catálogo
        run: |
          git status --short
          git diff -- catalogo.json

      - name: Guardar catálogo en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add catalogo.json

          if git diff --cached --quiet; then
            echo "No hay cambios en catalogo.json."
            exit 0
          fi

          git commit -m "Importa revista desde hemeroteca"
          git push

      - name: Marcar resultado de importación
        if: always()
        env:
          IMPORT_ID: ${{ inputs.import_id }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p /tmp/import-status

          if [ "$JOB_STATUS" = "success" ]; then
            STATUS="completed"
          else
            STATUS="failed"
          fi

          if [ "$STATUS" = "completed" ]; then
            PAGES="${{ steps.resumen.outputs.pages }}"
            R2_PATH="${{ steps.metadata.outputs.r2_path }}"
          else
            PAGES=""
            R2_PATH=""
          fi

          cat > /tmp/import-status/status.json <<EOF
          {
            "status": "${STATUS}",
            "importId": "${IMPORT_ID}",
            "pages": ${PAGES:-0},
            "r2Path": "${R2_PATH}"
          }
          EOF

          echo "========================================"
          echo "STATUS FINAL"
          echo "========================================"
          cat /tmp/import-status/status.json
          echo "========================================"

          rclone copyto \
            /tmp/import-status/status.json \
            "alpaca-r2:${R2_BUCKET}/imports/status/${IMPORT_ID}.json"
