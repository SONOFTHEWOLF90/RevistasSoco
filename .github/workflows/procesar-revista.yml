name: Procesar revista

on:
  workflow_dispatch:
    inputs:
      pdf_r2_path:
        description: "Ruta del PDF en R2"
        required: true
        type: string

      editorial:
        description: "Editorial"
        required: true
        type: string

      collection:
        description: "Colección"
        required: true
        type: string

      issue:
        description: "Número"
        required: true
        type: string

      name:
        description: "Nombre de la revista"
        required: true
        type: string

      magazine_prefix:
        description: "Prefijo de páginas"
        required: true
        type: string

jobs:
  procesar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone poppler-utils webp

      - name: Configurar R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone

          cat > ~/.config/rclone/rclone.conf <<EOF
          [alpaca-r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          no_check_bucket = true
          EOF

      - name: Mostrar datos recibidos
        run: |
          echo "========================================"
          echo "DATOS DE LA REVISTA"
          echo "========================================"
          echo "PDF:        ${{ inputs.pdf_r2_path }}"
          echo "Editorial:  ${{ inputs.editorial }}"
          echo "Colección:  ${{ inputs.collection }}"
          echo "Número:     ${{ inputs.issue }}"
          echo "Nombre:     ${{ inputs.name }}"
          echo "Prefijo:    ${{ inputs.magazine_prefix }}"
          echo "========================================"

      - name: Crear destino R2
        id: destino
        env:
          EDITORIAL: ${{ inputs.editorial }}
          COLLECTION: ${{ inputs.collection }}
          ISSUE: ${{ inputs.issue }}
          NAME: ${{ inputs.name }}
        run: |
          slugify() {
            echo "$1" \
              | iconv -f UTF-8 -t ASCII//TRANSLIT \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's/[^a-z0-9]/-/g' \
              | sed 's/-\+/-/g' \
              | sed 's/^-//' \
              | sed 's/-$//'
          }

          editorial_slug=$(slugify "$EDITORIAL")
          collection_slug=$(slugify "$COLLECTION")
          issue_slug=$(slugify "$ISSUE")
          name_slug=$(slugify "$NAME")

          base="${issue_slug}-${name_slug}"

          if [ -z "$base" ]; then
            base="$issue_slug"
          fi

          r2_path="magazines/${editorial_slug}/${collection_slug}/${base}"

          echo "r2_path=$r2_path" >> "$GITHUB_OUTPUT"

          echo "Destino R2:"
          echo "$r2_path"

      - name: Resultado
        env:
          R2_PATH: ${{ steps.destino.outputs.r2_path }}
        run: |
          echo "========================================"
          echo "DESTINO CALCULADO"
          echo "========================================"
          echo "$R2_PATH"
          echo "========================================"
